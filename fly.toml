# fly.toml app configuration file generated for bot-binance on 2026-11-28T11:19:56Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "bot-binance"
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['app']
  size = 'shared-cpu-1x'

[[restart]]
  policy = 'on-failure'
  processes = ['app']
